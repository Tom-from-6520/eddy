# eddy release pipeline.
# - Push a tag `v<upstream-version>-alpha.<n>` (e.g. v1.141.0-alpha.1) -> build Windows + Linux, publish a
#   GitHub pre-release, and update the update feed (the `updates` release) that installed eddy builds check.
# - Run manually (Actions -> eddy build -> Run workflow) -> build only; installers are kept as run artifacts.
name: eddy build

on:
  push:
    tags: ['v*-alpha.*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eddy-build-${{ github.ref }}
  cancel-in-progress: true

env:
  QUALITY: alpha
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
  FOUNDRY_LOCAL_SKIP_INSTALL: '1'
  # Avoids GitHub API rate limits when the build downloads Electron, sysroots and built-in extensions.
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  label:
    name: Version label
    runs-on: ubuntu-latest
    outputs:
      label: ${{ steps.label.outputs.label }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - id: label
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "label=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "label=$(node -p "require('./package.json').version")-$QUALITY.dev.$(git rev-parse --short=10 HEAD)" >> "$GITHUB_OUTPUT"
          fi

  windows-x64:
    name: Windows x64
    needs: label
    runs-on: windows-2022
    timeout-minutes: 240
    env:
      VSCODE_ARCH: x64
      npm_config_arch: x64
      LABEL: ${{ needs.label.outputs.label }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Upstream's Copilot simulation-test caches are in LFS and not needed to build.
          lfs: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Add signtool to PATH
        shell: pwsh
        run: |
          # Packaging strips signatures from bundled native binaries with signtool.exe (Windows SDK).
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1
          $signtool.DirectoryName >> $env:GITHUB_PATH

      - name: Install dependencies
        shell: pwsh
        run: |
          for ($i = 1; $i -le 3; $i++) {
            npm ci
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "npm ci failed (attempt $i), retrying..."
          }
          exit 1

      - name: Build app
        shell: pwsh
        run: npm run gulp vscode-win32-x64-min

      - name: Build installer (user setup)
        shell: pwsh
        run: |
          npm run gulp vscode-win32-x64-inno-updater
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run gulp vscode-win32-x64-user-setup

      - name: Collect outputs
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          $setup = Get-ChildItem .build\win32-x64\user-setup -Filter *.exe | Select-Object -First 1
          if (-not $setup) { throw 'user setup not found' }
          Copy-Item $setup.FullName "dist\eddy-$env:LABEL-win32-x64-user-setup.exe"
          Compress-Archive -Path ..\VSCode-win32-x64\* -DestinationPath "dist\eddy-$env:LABEL-win32-x64.zip"
          Get-ChildItem dist | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/*
          retention-days: 14

  linux-x64:
    name: Linux x64
    needs: label
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      EDDY_LABEL: ${{ needs.label.outputs.label }}
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Install build dependencies
        run: sudo ./eddy/scripts/linux-build.sh deps

      - name: Build app, .deb and .tar.gz
        run: ./eddy/scripts/linux-build.sh build

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: |
            .build/eddy-dist/linux/*.deb
            .build/eddy-dist/linux/*.tar.gz
          retention-days: 14

  release:
    name: Publish release and update feed
    if: github.ref_type == 'tag'
    needs: [label, windows-x64, linux-x64]
    runs-on: ubuntu-latest
    env:
      LABEL: ${{ needs.label.outputs.label }}
      # The built-in Actions token can't create releases on this account (HTTP 403 despite contents: write), so
      # publishing uses a fine-grained token with Contents: read and write on this repo, stored as EDDY_RELEASE_TOKEN.
      GH_TOKEN: ${{ secrets.EDDY_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Publish pre-release
        run: |
          gh release create "$TAG" dist/* \
            --repo "$REPO" \
            --target "$COMMIT" \
            --prerelease \
            --title "eddy $LABEL" \
            --notes "eddy **$LABEL** (alpha). Based on Code - OSS $(node -p "require('./package.json').version").

          Install: Windows \`eddy-$LABEL-win32-x64-user-setup.exe\` (updates itself) or the portable zip; Ubuntu/Debian \`sudo apt install ./eddy-$LABEL-linux-amd64.deb\`.

          Builds are not code-signed yet." \
            --generate-notes

      - name: Update the update feed
        run: |
          base="https://github.com/$REPO/releases/download/$TAG"
          page="https://github.com/$REPO/releases/tag/$TAG"
          now=$(date +%s000)
          setup="eddy-$LABEL-win32-x64-user-setup.exe"
          sha=$(sha256sum "dist/$setup" | cut -d' ' -f1)
          mkdir feed
          # Windows (installed with the user setup): downloaded and installed in the background, then "Restart to Update".
          jq -n --arg url "$base/$setup" --arg v "$COMMIT" --arg pv "$LABEL" --arg sha "$sha" --argjson ts "$now" \
            '{url: $url, name: $pv, version: $v, productVersion: $pv, sha256hash: $sha, timestamp: $ts}' > "feed/$QUALITY-win32-x64-user.json"
          # Portable zip and Linux: "Download Update" opens the release page.
          for platform in win32-x64-archive linux-x64; do
            jq -n --arg url "$page" --arg v "$COMMIT" --arg pv "$LABEL" --argjson ts "$now" \
              '{url: $url, name: $pv, version: $v, productVersion: $pv, timestamp: $ts}' > "feed/$QUALITY-$platform.json"
          done
          cat feed/*.json
          if ! gh release view updates --repo "$REPO" > /dev/null 2>&1; then
            gh release create updates --repo "$REPO" --prerelease --title "Update feed" \
              --notes "Files that installed eddy builds read to find new versions. Not a release; download eddy from the other releases."
          fi
          gh release upload updates feed/*.json --repo "$REPO" --clobber
